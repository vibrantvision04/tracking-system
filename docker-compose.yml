version: '3.8'

services:
  app:
    build: .
    ports:
      - "0.0.0.0:8080:8080"
      - "5027:5027"
    environment:
      # Hardcoded for Docker networking — .env values must NOT override these
      - DB_DSN=postgres://gps:password@db:5432/gpsdb
      - REDIS_URL=redis://redis:6379
      - REDIS_ADDR=redis:6379
      # CORS allow-list
      - FRONTEND_URL=https://tracking-system-rosy.vercel.app,http://localhost:3000,http://localhost:5173,http://localhost:8080
    depends_on:
      - redis
      - db

  db:
    image: timescale/timescaledb:2.27.2-pg15
    environment:
      - POSTGRES_DB=gpsdb
      - POSTGRES_USER=gps
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    command: postgres -c synchronous_commit=off -c wal_buffers=64MB -c checkpoint_timeout=15min -c max_wal_size=4GB
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --stop-writes-on-bgsave-error no
    ports:
      - "127.0.0.1:6379:6379"


volumes:
  pgdata:
