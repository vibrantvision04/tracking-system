version: '3.8'

services:
  app:
    build: .
    ports:
      - "5027:5027"
      - "8080:8080"
      - "8081:8081"
    environment:
      - DB_DSN=postgres://gps:password@db:5432/gpsdb
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
      - db

  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      - POSTGRES_DB=gpsdb
      - POSTGRES_USER=gps
      - POSTGRES_PASSWORD=password
    command: postgres -c synchronous_commit=off -c wal_buffers=64MB -c checkpoint_timeout=15min -c max_wal_size=4GB
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --stop-writes-on-bgsave-error no
    ports:
      - "6379:6379"

volumes:
  pgdata:
